[package]
name = "eqoxide-physics"
version = "0.1.0"
edition = "2021"

[dependencies]
eqoxide-core = { path = "../eqoxide-core" }
eqoxide-ipc = { path = "../eqoxide-ipc" }
eqoxide-zone-geometry = { path = "../eqoxide-zone-geometry" }
